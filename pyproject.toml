[project]
name = "gonzo"
version = "0.1.0"
description = "2D polygon discrete-element study of particle angularity in granular shear (reproduction of Krengel, Chen & Kikumoto 2023, Comput. Geotech. 164:105812)"
readme = "README.md"
authors = [
    { name = "Henrik Tuennermann", email = "henrik.tuennermann@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.8",
    "numba>=0.61",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.urls]
Repository = "https://github.com/HTuennermann/gonzo"

[project.scripts]
gonzo = "gonzo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "shapely>=2.0",
]
